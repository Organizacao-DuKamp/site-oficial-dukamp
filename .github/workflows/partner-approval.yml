name: Validate partner approval flow
on:
  push:
    branches: [codex/partner-approval]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/partners*.test.mjs tests/partner-cart.test.mjs tests/storefronts*.test.mjs tests/order-fulfillment.test.mjs
      - run: node scripts/check-types-against-base.mjs
      - run: npm run build
